# Deployment-Variante fuer EXEC_MODE=local: wg-acl-manager laeuft direkt auf
# dem WireGuard-Server selbst und verwaltet iptables ueber die Host-Netzwerk-
# Namespaces - kein eigener WG-Tunnel, kein SSH-Key noetig.
#
# Start:
#   docker compose -f docker-compose.local.yml up -d --build
#
# Voraussetzung: der echte WireGuard-Interface-Name des Hosts (Standard wg0)
# in TARGET_WG_INTERFACE, ADMIN_USER/ADMIN_PASSWORD gesetzt (siehe README -
# die Web-UI haengt hier direkt an allen Host-Interfaces, nicht nur an
# localhost).
services:
  wg-acl-manager:
    build: .
    container_name: wg-acl-manager
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - EXEC_MODE=local
      - TARGET_WG_INTERFACE=${TARGET_WG_INTERFACE:-wg0}
      # Oeffentlicher Endpoint (Host:Port) dieses Servers - wird fuer die
      # Client-Provisionierung ("Client bereitstellen") in generierte
      # Client-Configs eingesetzt.
      - WG_SERVER_ENDPOINT=${WG_SERVER_ENDPOINT:-${ISURFER_ENDPOINT:-}}
      - FLASK_SECRET=${FLASK_SECRET:-change-me-in-production}
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - wg-acl-data:/data
      # network_mode: host teilt nur die Netzwerk-Namespaces, NICHT das
      # Dateisystem - ohne diesen Mount sieht der Container die Host-Config
      # nicht und kann weder die Peer-Namen (Kommentare unter [Peer]) lesen
      # noch neue Peers/AllowedIPs-Aenderungen eintragen. Bewusst NICHT
      # read-only: "Client bereitstellen" (provisioning.register_peer_on_target)
      # haengt neue [Peer]-Bloecke an, und "Verwaltete Netze" pro Client
      # (wireguard.set_peer_allowed_ips) schreibt die AllowedIPs-Zeile eines
      # bestehenden Peers um - beides schlaegt mit "Read-only file system"
      # fehl, wenn dieser Mount ":ro" traegt.
      - /etc/wireguard:/etc/wireguard

volumes:
  wg-acl-data:

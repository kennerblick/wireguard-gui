<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WireGuard ACL Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-brand">WireGuard ACL Manager</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Dashboard</a>
            <a href="{{ url_for('provision') }}">Client bereitstellen</a>
            <a href="{{ url_for('services') }}">Dienste</a>
            <a href="{{ url_for('tags') }}">Gruppen</a>
            <a href="{{ url_for('netzplan') }}">Netzplan</a>
            <a href="{{ url_for('maintenance') }}">Wartung</a>
        </div>
    </nav>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>

services:
  wg-acl-manager:
    build: .
    container_name: wg-acl-manager
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - EXEC_MODE=ssh
      # WG_SERVER_* sind die aktuellen Variablennamen; die alten ISURFER_*-
      # Namen werden als Fallback durchgereicht, falls eure .env noch die
      # frueheren Namen verwendet.
      - WG_SERVER_PUBKEY=${WG_SERVER_PUBKEY:-${ISURFER_PUBKEY}}
      - WG_SERVER_ENDPOINT=${WG_SERVER_ENDPOINT:-${ISURFER_ENDPOINT}}
      - CONTAINER_WG_IP=${CONTAINER_WG_IP:-10.250.0.250}
      - WG_SERVER_TUNNEL_IP=${WG_SERVER_TUNNEL_IP:-${ISURFER_WG_IP:-10.250.0.1}}
      - TARGET_WG_INTERFACE=${TARGET_WG_INTERFACE:-wg0}
      - WG_SERVER_SSH_USER=${WG_SERVER_SSH_USER:-${ISURFER_SSH_USER:-root}}
      - FLASK_SECRET=${FLASK_SECRET:-change-me-in-production}
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - wg-acl-data:/data

volumes:
  wg-acl-data:
